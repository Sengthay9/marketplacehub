version: '3.9'

services:
  # ─────────────── Nginx ───────────────
  nginx:
    image: nginx:alpine
    container_name: mh_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mh_network

  # ─────────────── Frontend ───────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mh_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend/api
      - NEXT_PUBLIC_WS_URL=ws://backend:6001
    depends_on:
      - backend
    networks:
      - mh_network

  # ─────────────── Backend ───────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mh_backend
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-marketplacehub}
      - DB_USERNAME=${DB_USERNAME:-mhuser}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - BROADCAST_DRIVER=pusher
      - PUSHER_APP_ID=${PUSHER_APP_ID}
      - PUSHER_APP_KEY=${PUSHER_APP_KEY}
      - PUSHER_APP_SECRET=${PUSHER_APP_SECRET}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/storage:/var/www/html/storage
    networks:
      - mh_network

  # ─────────────── Queue Worker ───────────────
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mh_queue
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-marketplacehub}
      - DB_USERNAME=${DB_USERNAME:-mhuser}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
    depends_on:
      - backend
      - redis
    networks:
      - mh_network
    restart: unless-stopped

  # ─────────────── Scheduler ───────────────
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mh_scheduler
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction && sleep 60; done"
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-marketplacehub}
      - DB_USERNAME=${DB_USERNAME:-mhuser}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
    depends_on:
      - backend
    networks:
      - mh_network
    restart: unless-stopped

  # ─────────────── PostgreSQL ───────────────
  postgres:
    image: postgres:16-alpine
    container_name: mh_postgres
    environment:
      - POSTGRES_DB=${DB_DATABASE:-marketplacehub}
      - POSTGRES_USER=${DB_USERNAME:-mhuser}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mhuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mh_network

  # ─────────────── Redis ───────────────
  redis:
    image: redis:7-alpine
    container_name: mh_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mh_network

  # ─────────────── pgAdmin (dev only) ───────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mh_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@marketplacehub.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - mh_network
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:

networks:
  mh_network:
    driver: bridge
