# ═══════════════════════════════════════════════════════════════════════════════
#  CamCart — Production-Grade Nginx Configuration
#  Next.js 15 Frontend  +  Laravel 12 PHP-FPM Backend
#  Features: HTTP/2 · TLS 1.2/1.3 · Gzip · Rate limiting · Security headers
#            Dynamic DNS resolution · Structured JSON logging · Static caching
# ═══════════════════════════════════════════════════════════════════════════════

worker_processes     auto;           # one worker per CPU core
worker_rlimit_nofile 65535;          # max open file-descriptors per worker
pid                  /tmp/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    use                epoll;        # fastest Linux I/O model
    multi_accept       on;           # accept all pending connections at once
}

http {
    # ── MIME types ────────────────────────────────────────────────────────────
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Docker DNS resolver (re-resolves every 30 s → no stale-IP 502s) ──────
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # ── Hide Nginx version ────────────────────────────────────────────────────
    server_tokens off;

    # ── I/O & connection optimisations ───────────────────────────────────────
    sendfile              on;
    tcp_nopush            on;
    tcp_nodelay           on;
    keepalive_timeout     75s;
    keepalive_requests    1000;
    reset_timedout_connection on;

    # ── Client limits ─────────────────────────────────────────────────────────
    client_max_body_size        50m;
    client_body_timeout         30s;
    client_header_timeout       15s;
    client_body_buffer_size     128k;
    client_header_buffer_size   4k;
    large_client_header_buffers 4 16k;
    send_timeout                30s;

    # ── FastCGI (PHP-FPM) tuning ──────────────────────────────────────────────
    fastcgi_buffers            16 16k;
    fastcgi_buffer_size        32k;
    fastcgi_busy_buffers_size  64k;
    fastcgi_connect_timeout    10s;
    fastcgi_send_timeout       60s;
    fastcgi_read_timeout       60s;
    fastcgi_intercept_errors   on;

    # ── Proxy (Next.js) tuning ────────────────────────────────────────────────
    proxy_buffers            8 16k;
    proxy_buffer_size        32k;
    proxy_busy_buffers_size  64k;
    proxy_connect_timeout    10s;
    proxy_send_timeout       60s;
    proxy_read_timeout       60s;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_http_version 1.1;
    gzip_disable      "msie6";
    gzip_types
        text/plain text/css text/javascript text/xml text/x-component
        application/json application/javascript application/x-javascript
        application/xml application/xml+rss application/atom+xml
        application/vnd.ms-fontobject application/x-font-ttf
        font/eot font/opentype font/otf
        image/svg+xml image/x-icon;

    # ── Rate-limiting zones ───────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=auth:10m    rate=5r/m;   # login/register
    limit_req_zone  $binary_remote_addr zone=api:10m     rate=30r/s;  # general API
    limit_req_zone  $binary_remote_addr zone=general:10m rate=100r/s; # pages
    limit_conn_zone $binary_remote_addr zone=perip:10m;               # connection cap
    limit_req_status  429;
    limit_conn_status 429;

    # ── Open-file cache ───────────────────────────────────────────────────────
    open_file_cache          max=2000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ── WebSocket upgrade map ─────────────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Cache-Control per URI pattern ─────────────────────────────────────────
    # One map drives ALL Cache-Control headers so no location block ever needs
    # its own add_header — this keeps security-header inheritance intact.
    map $uri $cache_control {
        ~^/_next/static/   "public, max-age=31536000, immutable";
        ~^/_next/image     "public, max-age=86400, stale-while-revalidate=3600";
        ~^/api/            "no-store, no-cache, must-revalidate";
        ~^/storage/        "public, max-age=604800, stale-while-revalidate=86400";
        ~*\.(woff2?|ttf|eot|otf)$  "public, max-age=31536000, immutable";
        ~*\.(css|js|map)$           "public, max-age=31536000, immutable";
        ~*\.(ico|png|jpg|jpeg|gif|webp|svg)$  "public, max-age=604800";
        default            "no-store";
    }

    # ── Structured JSON access log ────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
          '"time":"$time_iso8601",'
          '"id":"$request_id",'
          '"ip":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$request_uri",'
          '"status":$status,'
          '"bytes":$body_bytes_sent,'
          '"req_ms":$request_time,'
          '"upstream_ms":"$upstream_response_time",'
          '"upstream":"$upstream_addr",'
          '"referer":"$http_referer",'
          '"ua":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ══════════════════════════════════════════════════════════════════════════
    #  HTTP — serves the app directly on port 80 (no cert warnings for dev)
    #  To enable HTTP→HTTPS redirect in production, replace this block with:
    #    location / { return 301 https://$host$request_uri; }
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        limit_conn perip 200;

        add_header Cache-Control              $cache_control                                        always;
        add_header X-Request-ID               $request_id                                          always;
        add_header X-Frame-Options            "SAMEORIGIN"                                         always;
        add_header X-Content-Type-Options     "nosniff"                                            always;
        add_header X-XSS-Protection           "1; mode=block"                                     always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"                   always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"          always;
        add_header Vary                       "Accept-Encoding"                                    always;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"kh-market-hub"}';
        }

        location = /nginx-status {
            stub_status;
            allow 127.0.0.1;
            allow 172.0.0.0/8;
            deny  all;
            access_log off;
        }

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        error_page 429 = @rate_limited_http;
        error_page 500 502 503 504 = @server_error_http;
        location @rate_limited_http {
            internal;
            default_type application/json;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded."}';
        }
        location @server_error_http {
            internal;
            default_type application/json;
            return 503 '{"error":"Service Unavailable","message":"Something went wrong."}';
        }

        location ~ ^/api/v[0-9]+/auth/(login|register|forgot-password|reset-password) {
            limit_req zone=auth burst=10 nodelay;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "$http_origin" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
                add_header Access-Control-Max-Age 3600;
                return 204;
            }
            add_header Access-Control-Allow-Origin      "$http_origin" always;
            add_header Access-Control-Allow-Credentials "true"         always;

            set $backend "backend:9000";
            fastcgi_pass  $backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param REQUEST_URI     $request_uri;
            include fastcgi_params;
            fastcgi_param HTTP_X_REAL_IP         $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_REQUEST_ID      $request_id;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "$http_origin" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
                add_header Access-Control-Max-Age 3600;
                return 204;
            }
            add_header Access-Control-Allow-Origin      "$http_origin" always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;

            set $backend "backend:9000";
            fastcgi_pass  $backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param REQUEST_URI     $request_uri;
            include fastcgi_params;
            fastcgi_param HTTP_X_REAL_IP         $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_REQUEST_ID      $request_id;
        }

        location /storage/ {
            alias /var/www/html/public/storage/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        location /app/ {
            set $frontend "frontend:3000";
            proxy_pass         http://$frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /_next/ {
            set $frontend "frontend:3000";
            proxy_pass         http://$frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        location / {
            limit_req zone=general burst=200 nodelay;

            set $frontend "frontend:3000";
            proxy_pass         http://$frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         $connection_upgrade;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_set_header   X-Request-ID       $request_id;
            proxy_buffering    off;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ══════════════════════════════════════════════════════════════════════════
    #  HTTPS — main production server
    # ══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        # ── TLS configuration ─────────────────────────────────────────────────
        ssl_certificate      /etc/nginx/certs/server.crt;
        ssl_certificate_key  /etc/nginx/certs/server.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout  1d;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_tickets  off;
        # Uncomment when using a CA-signed certificate:
        # ssl_stapling        on;
        # ssl_stapling_verify on;

        # ── Connection limits ─────────────────────────────────────────────────
        limit_conn perip 200;

        # ── Security & caching headers (applied to EVERY response) ────────────
        # NOTE: No location block uses add_header, so all responses here
        # inherit these headers without exception.
        add_header Cache-Control              $cache_control                                        always;
        add_header X-Request-ID               $request_id                                          always;
        add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload"       always;
        add_header X-Frame-Options            "SAMEORIGIN"                                         always;
        add_header X-Content-Type-Options     "nosniff"                                            always;
        add_header X-XSS-Protection           "1; mode=block"                                     always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"                   always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"          always;
        add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'self';" always;
        add_header Vary                       "Accept-Encoding"                                    always;

        # ── Internal error responses ──────────────────────────────────────────
        error_page 429 = @rate_limited;
        error_page 500 502 503 504 = @server_error;

        location @rate_limited {
            internal;
            default_type application/json;
            return 429 '{"error":"Too Many Requests","message":"Slow down — rate limit exceeded."}';
        }
        location @server_error {
            internal;
            default_type application/json;
            return 503 '{"error":"Service Unavailable","message":"Something went wrong. Try again shortly."}';
        }

        # ── Health check & metrics ────────────────────────────────────────────
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"kh-market-hub","tls":true}';
        }

        location = /nginx-status {
            stub_status;
            allow 127.0.0.1;
            allow 172.0.0.0/8;
            deny  all;
            access_log off;
        }

        # ── Auth endpoints — strict rate limit (anti-brute-force) ─────────────
        location ~ ^/api/v[0-9]+/auth/(login|register|forgot-password|reset-password) {
            limit_req zone=auth burst=10 nodelay;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "$http_origin"                                    always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"          always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
                add_header Access-Control-Max-Age       3600;
                return 204;
            }

            add_header Access-Control-Allow-Origin      "$http_origin" always;
            add_header Access-Control-Allow-Credentials "true"         always;

            set $backend "backend:9000";
            fastcgi_pass  $backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param REQUEST_URI     $request_uri;
            include fastcgi_params;
            fastcgi_param HTTPS           on;
            fastcgi_param SERVER_PORT     443;
            fastcgi_param HTTP_X_REAL_IP           $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR     $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_PROTO   https;
            fastcgi_param HTTP_X_REQUEST_ID        $request_id;
        }

        # ── All other API endpoints ───────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=60 nodelay;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "$http_origin"                                    always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"          always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
                add_header Access-Control-Max-Age       3600;
                return 204;
            }

            add_header Access-Control-Allow-Origin      "$http_origin" always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;

            set $backend "backend:9000";
            fastcgi_pass  $backend;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param REQUEST_URI     $request_uri;
            include fastcgi_params;
            fastcgi_param HTTPS                      on;
            fastcgi_param SERVER_PORT                443;
            fastcgi_param HTTP_X_REAL_IP             $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_FOR       $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_PROTO     https;
            fastcgi_param HTTP_X_REQUEST_ID          $request_id;
        }

        # ── Laravel storage (media, avatars, documents) ───────────────────────
        location /storage/ {
            alias /var/www/html/public/storage/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # ── WebSocket / real-time (Laravel Echo / Pusher) ─────────────────────
        location /app/ {
            set $frontend "frontend:3000";
            proxy_pass         http://$frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Next.js static chunks (immutable, logged off) ─────────────────────
        location /_next/ {
            set $frontend "frontend:3000";
            proxy_pass         http://$frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }

        # ── All other requests → Next.js SSR ──────────────────────────────────
        location / {
            limit_req zone=general burst=200 nodelay;

            set $frontend "frontend:3000";
            proxy_pass         http://$frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade              $http_upgrade;
            proxy_set_header   Connection           $connection_upgrade;
            proxy_set_header   Host                 $host;
            proxy_set_header   X-Real-IP            $remote_addr;
            proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto    https;
            proxy_set_header   X-Forwarded-Host     $host;
            proxy_set_header   X-Forwarded-Port     443;
            proxy_set_header   X-Request-ID         $request_id;
            proxy_buffering    off;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
